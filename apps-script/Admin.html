              <select id="attTargetGroup" class="bg-white font-semibold">

                <optgroup label="Satsang">

            </label>

          <div class="flex shadow-sm rounded-md overflow-hidden border border-gray-300">

            <button id="attSearchBtn" type="button" class="bg-indigo-600 text-white px-6 font-bold hover:bg-indigo-700 flex items-center justify-center transition-colors touch-btn">

  <script>
    const homeLink = document.getElementById('homeLink');
    const tabRegister = document.getElementById('tabRegister');
    const tabAttendance = document.getElementById('tabAttendance');
    const viewRegister = document.getElementById('viewRegister');
    const viewAttendance = document.getElementById('viewAttendance');
    const attDateInput = document.getElementById('attDate');

    window.addEventListener('load', () => {
      if (homeLink) {
        homeLink.addEventListener('click', function(e) {
          if (document.getElementById('navLoadingOverlay')) return;
          const overlay = document.createElement('div');
          overlay.id = 'navLoadingOverlay';
          overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,251,235,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:inherit;backdrop-filter:blur(2px);';
          overlay.innerHTML = `
            <div style="background:#fff;border-radius:18px;border-top:6px solid #f59e0b;padding:26px 36px;box-shadow:0 12px 28px rgba(0,0,0,0.12);display:flex;flex-direction:column;align-items:center;text-align:center;">
              <div style="width:38px;height:38px;border:3px solid #fef3c7;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px;"></div>
              <div style="color:#78350f;font-weight:700;font-size:16px;margin-bottom:4px;">Returning to Attendance...</div>
              <div style="color:#92400e;font-size:12px;">Please wait a moment...</div>
            </div>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          `;
          document.body.appendChild(overlay);

          if (!this.href || this.href.endsWith('#')) {
            e.preventDefault();
            window.location.search = '';
          }
        });
      }

      google.script.run.withSuccessHandler(url => { if (homeLink && (!homeLink.href || homeLink.href.endsWith('#'))) homeLink.href = url; }).getScriptUrl();

      tabRegister.addEventListener('click', (e) => {
        e.preventDefault();
        tabRegister.className = "flex-1 pb-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors touch-btn";
        tabAttendance.className = "flex-1 pb-3 text-center font-bold text-gray-500 hover:text-indigo-600 border-b-2 border-transparent focus:outline-none transition-colors touch-btn";
        viewRegister.classList.replace('hidden', 'block');
        viewAttendance.classList.replace('block', 'hidden');
      });

      tabAttendance.addEventListener('click', (e) => {
        e.preventDefault();
        tabAttendance.className = "flex-1 pb-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors touch-btn";
        tabRegister.className = "flex-1 pb-3 text-center font-bold text-gray-500 hover:text-indigo-600 border-b-2 border-transparent focus:outline-none transition-colors touch-btn";
        viewAttendance.classList.replace('hidden', 'block');
        viewRegister.classList.replace('block', 'hidden');

        if (!attDateInput.value) {
          const today = new Date();
          const yyyy = today.getFullYear();
          const mm = String(today.getMonth() + 1).padStart(2, '0');
          const dd = String(today.getDate()).padStart(2, '0');
          attDateInput.value = `${yyyy}-${mm}-${dd}`;
        }
      });
    });

    // ============= REGISTRATION =============
    const form = document.getElementById('addStudentForm');
    const targetGroupSelect = document.getElementById('targetGroup');
    const formFields = document.getElementById('formFields');
    const jigyasuSection = document.getElementById('jigyasuSection');
    const classWrapper = document.getElementById('classWrapper');
    const occupationWrapper = document.getElementById('occupationWrapper');
    const classInput = document.getElementById('class');
    const occupationInput = document.getElementById('occupation');
    const sewaCheckboxWrapper = document.getElementById('sewaCheckboxWrapper');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const submitSpinner = document.getElementById('submitSpinner');
    const adminMessageArea = document.getElementById('adminMessageArea');

    targetGroupSelect.addEventListener('change', () => {
      const targetGroup = targetGroupSelect.value;
      if (!targetGroup) {
        formFields.classList.add('hidden');
        sewaCheckboxWrapper.classList.add('hidden');
        return;
      }

      formFields.classList.remove('hidden');
      if (targetGroup && !targetGroup.includes('_Sewa')) sewaCheckboxWrapper.classList.remove('hidden');
      else sewaCheckboxWrapper.classList.add('hidden');

      if (targetGroup.includes('Student')) {
        jigyasuSection.classList.add('hidden');
        classWrapper.classList.remove('hidden');
        occupationWrapper.classList.add('hidden');
        classInput.required = true;
        occupationInput.required = false;
      } else {
        jigyasuSection.classList.remove('hidden');
        jigyasuSection.style.display = 'grid';
        classWrapper.classList.add('hidden');
        occupationWrapper.classList.remove('hidden');
        classInput.required = false;
        occupationInput.required = false;
      }

      const titleSelect = document.getElementById('title');
      if (targetGroup.includes('JigyasuG') || targetGroup.includes('StudentB')) {
        titleSelect.value = 'MR'; titleSelect.disabled = true;
      } else if (targetGroup.includes('JigyasuL') || targetGroup.includes('StudentG')) {
        titleSelect.value = 'MS'; titleSelect.disabled = true;
      } else {
        titleSelect.disabled = false;
      }
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const targetGroup = targetGroupSelect.value;
      const getValue = (id) => document.getElementById(id) ? document.getElementById(id).value.trim() : '';
      const alsoAddToSewa = document.getElementById('addToSewa').checked;

      if (!targetGroup) {
        showRegMessage('error', 'Please select a Target Group first.');
        return;
      }

      const studentData = {
        title: document.getElementById('title').value,
        firstName: getValue('firstName'), middleName: getValue('middleName'), lastName: getValue('lastName'),
        dob: getValue('dob'),
        fatherTitle: 'MR', fatherFirstName: getValue('fatherFirstName'),
        fatherMiddleName: getValue('fatherMiddleName'), fatherLastName: getValue('fatherLastName'),
        motherTitle: 'MS', motherFirstName: getValue('motherFirstName'),
        motherMiddleName: getValue('motherMiddleName'), motherLastName: getValue('motherLastName'),
        spouseTitle: getValue('spouseTitle'), spouseFirstName: getValue('spouseFirstName'),
        spouseMiddleName: getValue('spouseMiddleName'), spouseLastName: getValue('spouseLastName'),
        address1: getValue('address1'), address2: getValue('address2'), address3: getValue('address3'),
        phone: getValue('phone'), email: getValue('email'),
        class: getValue('class'), occupation: getValue('occupation'),
        aadhar: getValue('aadhar')
      };

      submitBtn.disabled = true;
      submitBtnText.classList.add('hidden');
      submitSpinner.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(response => {
          submitBtn.disabled = false;
          submitBtnText.classList.remove('hidden');
          submitSpinner.classList.add('hidden');
          showRegMessage(response.status, response.message);
          if (response.status === 'success') {
            form.reset();
            sewaCheckboxWrapper.classList.add('hidden');
            formFields.classList.add('hidden');
          }
        })
        .withFailureHandler(err => {
          submitBtn.disabled = false;
          submitBtnText.classList.remove('hidden');
          submitSpinner.classList.add('hidden');
          showRegMessage('error', 'An unexpected error occurred: ' + err.message);
        })
        .addStudent(studentData, targetGroup, alsoAddToSewa);
    });

    function showRegMessage(type, text) {
      adminMessageArea.className = `mt-4 text-center text-sm font-semibold p-3 rounded-md transition-opacity duration-300 ${
        type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'
      }`;
      adminMessageArea.textContent = text;
      adminMessageArea.classList.remove('hidden');
      setTimeout(() => { if (adminMessageArea.textContent === text) adminMessageArea.classList.add('hidden'); }, 6000);
    }

    // ============= BACK-DATE ATTENDANCE =============
    const attSearchTerm = document.getElementById('attSearchTerm');
    const attSearchBtn = document.getElementById('attSearchBtn');
    const attSearchBtnText = document.getElementById('attSearchBtnText');
    const attSearchSpinner = document.getElementById('attSearchSpinner');
    const attResultsArea = document.getElementById('attResultsArea');
    const attMessageArea = document.getElementById('attMessageArea');
    const attSearchTypeRadios = document.querySelectorAll('input[name="attSearchType"]');
    const attTargetGroup = document.getElementById('attTargetGroup');

    attSearchTypeRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (radio.value === 'branchNo') {
          attSearchTerm.type = 'number';
          attSearchTerm.placeholder = 'Enter Branch No...';
        } else {
          attSearchTerm.type = 'text';
          attSearchTerm.placeholder = 'Enter Name...';
        }
        attSearchTerm.value = '';
        attResultsArea.innerHTML = '';
      });
    });

    attSearchTerm.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleAttSearch(); });
    attSearchBtn.addEventListener('click', handleAttSearch);

    function showAttMessage(type, text) {
      attMessageArea.className = `mt-4 text-center text-sm font-bold p-3 rounded-md transition-opacity duration-300 ${
        type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 
        type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 
        'bg-yellow-50 text-yellow-700 border border-yellow-200'
      }`;
      attMessageArea.textContent = text;
      attMessageArea.classList.remove('hidden');
      setTimeout(() => { if (attMessageArea.textContent === text) attMessageArea.classList.add('hidden'); }, 5000);
    }

    function handleAttSearch() {
      const term = attSearchTerm.value.trim();
      if (!term) return;

      const searchType = document.querySelector('input[name="attSearchType"]:checked').value;
      const targetGroup = attTargetGroup.value;
      const date = attDateInput.value;

      if (!targetGroup) { showAttMessage('error', 'Please select a Target Sheet above.'); return; }
      if (!date) { showAttMessage('error', 'Please select a Date above.'); return; }

      attResultsArea.innerHTML = '';
      attMessageArea.classList.add('hidden');
      attSearchBtn.disabled = true;
      attSearchBtnText.classList.add('hidden');
      attSearchSpinner.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(results => {
          attSearchBtn.disabled = false;
          attSearchBtnText.classList.remove('hidden');
          attSearchSpinner.classList.add('hidden');

          const filtered = results.filter(r => r.targetGroup === targetGroup);
          if (filtered && filtered.length > 0) {
            displayAttResults(filtered, targetGroup, date);
          } else {
            showAttMessage('error', 'No members found in selected sheet.');
          }
        })
        .withFailureHandler(err => {
          attSearchBtn.disabled = false;
          attSearchBtnText.classList.remove('hidden');
          attSearchSpinner.classList.add('hidden');
          showAttMessage('error', 'Error: ' + err.message);
        })
        .findStudents(term, searchType, targetGroup.includes('_Sewa') ? 'Sewa' : 'Branch');
    }

    function displayAttResults(students, targetGroup, date) {
      students.forEach(student => {
        const div = document.createElement('div');
        div.className = 'p-4 bg-gray-50 rounded-lg border border-gray-200 flex items-center justify-between gap-3 card-enter hover:bg-gray-100/70 transition-colors';
        div.innerHTML = `
          <div class="flex-grow">
            <p class="font-bold text-gray-800">${escapeHtml(student.name)}</p>
            <p class="text-xs text-gray-500">Father: ${escapeHtml(student.fatherName)}</p>
            <p class="text-xs text-indigo-600 font-bold">Branch: #${student.branchNo}</p>
          </div>
          <div class="flex-shrink-0">
            <button class="w-32 text-sm bg-green-600 text-white font-bold py-2.5 px-3 rounded-md hover:bg-green-700 flex items-center justify-center transition-all shadow-sm touch-btn" onclick="markBackDateAtt(this, '${student.branchNo}', '${targetGroup}', '${date}', '${escapeHtml(student.name)}')">
                <span class="btn-text">Mark Present</span>
                <div class="spinner hidden"></div>
            </button>
          </div>
        `;
        attResultsArea.appendChild(div);
      });
    }

    function markBackDateAtt(btn, branchNo, targetGroup, date, studentName) {
      const textEl = btn.querySelector('.btn-text');
      const spinnerEl = btn.querySelector('.spinner');

      btn.disabled = true;
      textEl.classList.add('hidden');
      spinnerEl.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(status => {
          textEl.classList.remove('hidden');
          spinnerEl.classList.add('hidden');
          if (status === 'SUCCESS') {
            btn.className = "w-32 text-sm bg-gray-400 text-white font-bold py-2.5 px-3 rounded-md cursor-not-allowed flex items-center justify-center";
            textEl.textContent = 'Queued';
            showAttMessage('success', `✓ Marked ${branchNo} (${studentName}) for ${date}`);
          } else if (status === 'DUPLICATE') {
            btn.className = "w-32 text-sm bg-gray-400 text-white font-bold py-2.5 px-3 rounded-md cursor-not-allowed flex items-center justify-center";
            textEl.textContent = 'Already Marked';
            showAttMessage('warning', `Duplicate: ${branchNo} is already marked on ${date}`);
          } else {
            btn.disabled = false;
            showAttMessage('error', `Error for ${branchNo}. Try again.`);
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          textEl.classList.remove('hidden');
          spinnerEl.classList.add('hidden');
          showAttMessage('error', `Network Error. Try again.`);
        })
        .markPresent({ branchNo: branchNo, date: date, markedBy: 'Admin' }, targetGroup);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
