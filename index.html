<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Adanbagh Attendance - Dayalbagh</title>

  <!-- PWA & Mobile Meta Tags (Universal Android + iOS) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #fffbeb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #fffbeb;
      /* Safe area insets for iPhone 14/15/16 Dynamic Island and home bar */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Top Accent Line (Dayalbagh Yellow) */
    .top-accent-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
      flex-shrink: 0;
      z-index: 100;
    }

    /* Fullscreen Iframe */
    #portal-frame {
      width: 100%;
      height: 100%;
      flex: 1;
      border: none;
      display: block;
      background-color: #fffbeb;
      z-index: 10;
    }

    /* Splash Screen */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fffbeb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s ease-out, visibility 0.4s;
      padding: 24px;
      text-align: center;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      background: #ffffff;
      border: 1px solid #fef3c7;
      border-top: 6px solid #f59e0b;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.15), 0 8px 10px -6px rgba(217, 119, 6, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
      margin-bottom: 20px;
      object-fit: cover;
    }

    .splash-title {
      font-size: 20px;
      font-weight: 800;
      color: #78350f;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .splash-sub {
      font-size: 13px;
      font-weight: 600;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #fef3c7;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-status {
      font-size: 13px;
      color: #b45309;
      font-weight: 500;
    }

    /* PWA Install Banner (Android + iOS) */
    #install-banner {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #fde68a;
      border-left: 6px solid #f59e0b;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 1000;
      animation: slideUp 0.35s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .banner-text-box {
      flex: 1;
    }

    .banner-title {
      font-size: 14px;
      font-weight: 700;
      color: #78350f;
      line-height: 1.2;
    }

    .banner-sub {
      font-size: 12px;
      color: #92400e;
      margin-top: 3px;
      line-height: 1.3;
    }

    .banner-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .install-action-btn {
      background: #f59e0b;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.4);
      white-space: nowrap;
    }

    .install-action-btn:active {
      transform: scale(0.96);
      background: #d97706;
    }

    .close-banner-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
    }

    /* Floating Reload Button */
    .floating-bar {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom));
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 200;
    }

    .floating-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #fde68a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #92400e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    .floating-btn:active {
      transform: scale(0.9);
      background: #fef3c7;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="top-accent-bar"></div>
    
    <!-- Fullscreen Sandboxed App Iframe -->
    <iframe id="portal-frame" allow="geolocation; camera; microphone" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals"></iframe>
  </div>

  <!-- Satsang Splash Loading Screen -->
  <div id="splash-screen">
    <div class="splash-card">
      <img src="icon-192.png" alt="Logo" class="splash-logo">
      <h1 class="splash-title">Ra-Dha-Sva-Aah-Mi</h1>
      <h2 class="splash-sub">Dayalbagh • Adanbagh Branch</h2>
      <div class="spinner"></div>
      <p class="splash-status" id="status-text">Opening Attendance Portal...</p>
    </div>
  </div>

  <!-- PWA Install Banner (Android Auto-Trigger + iOS Guidance) -->
  <div id="install-banner">
    <div class="banner-text-box">
      <div class="banner-title" id="banner-title-text">📲 Install Adanbagh App</div>
      <div class="banner-sub" id="banner-sub-text">Install on phone for 1-tap full-screen access</div>
    </div>
    <div class="banner-btn-group">
      <button class="install-action-btn" id="install-btn">Install</button>
      <button class="close-banner-btn" id="dismiss-banner">&times;</button>
    </div>
  </div>

  <!-- Floating Utility: Quick Reload -->
  <div class="floating-bar">
    <button class="floating-btn" id="refresh-btn" title="Reload Portal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
      </svg>
    </button>
  </div>

  <script>
    // ================= STATICALLY HARDCODED APPS SCRIPT URL =================
    const APPS_SCRIPT_BASE_URL = "https://script.google.com/macros/s/AKfycbzgfdInSrXH098wQmRvK3Tj93D9RvFrPvKj-mwCLmYRStBkDW_culN1o1qg20vN8MV16w/exec";

    function initPortal() {
      const frame = document.getElementById('portal-frame');
      const splash = document.getElementById('splash-screen');
      const statusText = document.getElementById('status-text');

      let targetUrl = APPS_SCRIPT_BASE_URL;

      // Forward page parameters if any (?page=info or ?page=admin)
      const urlParams = new URLSearchParams(window.location.search);
      const page = urlParams.get('page');
      if (page) {
        targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'page=' + encodeURIComponent(page);
      }

      statusText.textContent = "Connecting to Attendance Portal...";
      frame.src = targetUrl;

      // Fade out splash screen when loaded
      frame.onload = function() {
        setTimeout(() => {
          splash.classList.add('fade-out');
        }, 300);
      };

      // Safety fallback timeout
      setTimeout(() => {
        splash.classList.add('fade-out');
      }, 4500);
    }

    // Refresh Button Handler
    document.getElementById('refresh-btn').addEventListener('click', function() {
      const splash = document.getElementById('splash-screen');
      const statusText = document.getElementById('status-text');
      splash.classList.remove('fade-out');
      statusText.textContent = "Reloading portal...";
      const frame = document.getElementById('portal-frame');
      frame.src = frame.src;
    });

    // ================= PWA INSTALLATION (ANDROID + IPHONE) =================
    let deferredPrompt = null;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-banner');
    const bannerTitle = document.getElementById('banner-title-text');
    const bannerSub = document.getElementById('banner-sub-text');

    // Detect if running on iPhone/iPad
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

    // Check if dismissed before in this session
    const isDismissed = sessionStorage.getItem('PWA_BANNER_DISMISSED');

    if (isIos && !isStandalone && !isDismissed) {
      // Show Apple-specific instruction on iPhone Safari
      bannerTitle.textContent = "📲 Install on your iPhone";
      bannerSub.innerHTML = "Tap the <strong>Share</strong> button (square with arrow ⎋) at the bottom, then tap <strong>'Add to Home Screen'</strong>";
      installBtn.style.display = 'none'; // iOS has no programmatic trigger
      installBanner.style.display = 'flex';
    }

    // Android Chrome prompt event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isDismissed) {
        installBanner.style.display = 'flex';
      }
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      installBanner.style.display = 'none';
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`User install response: ${outcome}`);
      deferredPrompt = null;
    });

    dismissBtn.addEventListener('click', () => {
      installBanner.style.display = 'none';
      sessionStorage.setItem('PWA_BANNER_DISMISSED', 'true');
    });

    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      deferredPrompt = null;
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker registered:', reg.scope))
          .catch((err) => console.log('ServiceWorker registration failed:', err));
      });
    }

    // Launch Portal Immediately
    initPortal();
  </script>
</body>
</html>
